# Baut die Startseite „Familie Ulfert“ samt aller eingebundenen Apps (siehe apps.json)
# und veröffentlicht alles zusammen auf GitHub Pages.
# Einmalig aktivieren: Repository → Settings → Pages → Source: „GitHub Actions“.
name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Wird vom Kochbuch (und künftigen Apps) angestoßen, damit deren Änderungen hier ankommen
  repository_dispatch:
    types: [app-updated]
  # Sicherheitsnetz: einmal täglich neu bauen, falls ein Anstoß fehlt
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pfad auf GitHub Pages = /<Repository-Name>/ (funktioniert auch beim zeitgesteuerten Lauf)
      - run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:apps
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
